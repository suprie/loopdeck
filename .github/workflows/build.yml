# Release artifact pipeline — see docs/release-pipeline.md for the full
# definition (version policy, stages, smoke-test handoff, signing, out-of-scope).
# The install/upgrade/rollback contract those artifacts must satisfy is in
# docs/alpha-distribution.md.
#
# Scope: only the macOS arm64 .dmg is a SUPPORTED release artifact (it is the
# one smoke-tested, documented install path). The Linux and Windows matrix
# entries are EXPERIMENTAL — the pipeline compiles+bundles them so cross-OS
# regressions are visible, but they are NOT installation-tested, NOT signed,
# and NOT covered by the install contract. See docs/release-pipeline.md §1.
name: build

on:
  push:
    tags: ['v*']          # build installers when you tag a release, e.g. git tag v0.1.0
  workflow_dispatch: {}   # or run manually from the Actions tab

permissions:
  contents: write         # needed to upload artifacts to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # SUPPORTED  → .dmg (arm64, Apple Silicon) — smoke-tested
          - platform: ubuntu-22.04      # EXPERIMENTAL → .AppImage + .deb (not installation-tested)
          - platform: windows-latest    # EXPERIMENTAL → .exe (NSIS) + .msi (not installation-tested)
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5        # v5 = Node.js 24 runtime (v4 = deprecated Node 20)

      - name: Install Node.js
        uses: actions/setup-node@v5      # v5 = Node.js 24 runtime
        with:
          node-version: lts/*            # currently 22; pin '24' if you prefer
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Builds installers for the current OS and attaches them to the release.
      # macOS code-signing is intentionally OFF (matches loops.md P2 — signing
      # is not yet configured).
      #
      # IMPORTANT: the APPLE_* env vars are deliberately *omitted*, not set to
      # `${{ secrets.X }}`. A missing secret expands to an empty string "", the
      # env var is still exported, and tauri-bundler reads `APPLE_CERTIFICATE`
      # as `Some("")` — it then base64-decodes nothing, hands an empty blob to
      # `security import`, and fails with "failed to import keychain certificate".
      # Leaving the var unset makes `env::var(...).ok()` return `None` so the
      # bundler skips signing entirely and emits an unsigned .dmg.
      #
      # To turn signing + notarization back on later: create these repo secrets,
      # then re-add the matching env lines below. All six are required together.
      #   APPLE_CERTIFICATE          # Developer ID Application .p12, base64-encoded
      #   APPLE_CERTIFICATE_PASSWORD # export password for the .p12
      #   APPLE_SIGNING_IDENTITY     # "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID                   # Apple ID of the notarization account
      #   APPLE_PASSWORD             # app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID              # 10-char team identifier
      - name: Build & release installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
