name: CI

# CI for the overnight-orchestration epic's safety prerequisite (ADR-6):
# un-eyeballed overnight PRs need an automated reviewer's net, so this gates
# every PR — including agent-drafted ones — before Phase 2+ of that epic
# starts. macOS + Ubuntu matrix (`prd-safety-prereqs` P1): macOS is the
# alpha's primary target platform, Ubuntu is the second cheaply-available
# runner and catches Linux-only build breaks (distinct system webkit2gtk/gtk
# deps) early. Windows stays out of scope until a Windows alpha exists (the
# P3 backlog line keeps it, per `docs/epics/overnight-orchestration/prd-safety-prereqs.md`
# Non-Goals).
#
# This workflow supersedes the old `rust.yml` (ubuntu build+test only), which
# it entirely covers plus fmt + clippy + the frontend build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt · clippy · test · build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5        # v5 = Node.js 24 runtime (v4 = deprecated Node 20)

      # Tauri's Rust crates (gtk/webkit2gtk bindings) need these system
      # headers to build on Linux; macOS ships the equivalent frameworks.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ---------------- Rust ----------------
      - name: Install Rust stable (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      # `cargo clippy -D warnings` — warnings are CI failures, not advice. The
      # prior lint debt (6 clippy warnings) was cleared in the "Clear current
      # lint debt" gate step; keep this strict so new debt can't slip in. The
      # two intentional `#[allow]`s (`too_many_arguments` on the 9-field
      # `ConversationTurn::assistant` constructor; `cfg(test)` on the test-only
      # `parse_response`) are annotated at the call sites with their rationale.
      - name: cargo clippy (-D warnings)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # ---------------- Frontend ----------------
      - name: Install Node.js
        uses: actions/setup-node@v5        # v5 = Node.js 24 runtime
        with:
          node-version: lts/*
          cache: npm

      - name: npm ci
        run: npm ci

      # `npm run build` runs `tsc` (type-check) then `vite build`, so the
      # frontend type-check is covered here — no separate `tsc --noEmit` step.
      - name: npm run build
        run: npm run build
